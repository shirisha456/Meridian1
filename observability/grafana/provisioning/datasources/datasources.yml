apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        # Loki has trace_id as structured metadata (see
        # observability/promtail/promtail-config.yml), not a label —
        # filterByTraceID appends `| trace_id="<id>"` to the base query,
        # which does work against structured metadata fields even though
        # they can't appear in the stream selector itself.
        filterByTraceID: true
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
