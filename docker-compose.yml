# Phase 0: infrastructure-only skeleton. core-api, the four Kafka/poller
# services, the redpanda-topics bootstrap job, and the observability stack
# (Prometheus/Grafana/Loki/Promtail/Tempo) are added in the phases that
# introduce their code (see docs/phase0.md and the README phase table).
#
# name: pinned explicitly (rather than left to default to the checkout
# directory name) so this project's containers never collide with or get
# treated as orphans of an unrelated "meridian"-named Compose project that
# may already exist on a dev machine.
name: meridian-rebuild

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5433:5432"
    volumes:
      - meridian_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates every topic in meridian_events.Topics up front so
  # core-api and (from Phase 8+) the consumer services never race a
  # first-ever produce/consume against a topic that doesn't exist yet.
  # Treats "already exists" as success so this is safe to re-run.
  # NOTE: this list is hand-kept in sync with Topics.all() in
  # libs/events/meridian_events/topics.py — there's no way to import
  # Python into a shell command here, so a topic added there needs the
  # same name added to this list by hand (the same tradeoff the
  # reference implementation had at this exact boundary).
  redpanda-topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >
        rpk topic create transactions.ingested transactions.enriched alerts.raised insights.generated
        --brokers redpanda:9092 --partitions 3 --replicas 1 || true

  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@postgres:5432/meridian
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/core-api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully

  enrichment-service:
    build:
      context: .
      dockerfile: services/enrichment-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@postgres:5432/meridian
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully

  anomaly-service:
    build:
      context: .
      dockerfile: services/anomaly-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@postgres:5432/meridian
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: development
    depends_on:
      redis:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully

volumes:
  meridian_pg_data:
