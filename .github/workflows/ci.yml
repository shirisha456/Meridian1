name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  events-lib:
    name: Shared event contracts (libs/events)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/events
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: ruff check .

  backend:
    name: Backend tests + migration check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@localhost:5432/meridian
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # libs/events first — apps/core-api's pyproject.toml deliberately
        # doesn't declare it as a dependency (see that file's comment and
        # docs/phase7.md); this monorepo has no workspace tool, so both
        # packages are installed explicitly, in order.
        run: |
          pip install -e ../../libs/events
          pip install -e ".[dev]"
      - name: Alembic migrations apply against real Postgres
        run: alembic upgrade head
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: ruff check .

  enrichment-service:
    name: enrichment-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/enrichment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ../../libs/events
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: ruff check .

  anomaly-service:
    name: anomaly-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/anomaly-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ../../libs/events
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: ruff check .

  notification-service:
    name: notification-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ../../libs/events
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: ruff check .

  frontend:
    name: Frontend build, typecheck, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        # No NEXT_PUBLIC_API_URL set here — this only needs to prove the
        # app compiles and typechecks, not reach a real backend; that's
        # covered manually per-phase (see docs/phase11.md), same scope
        # boundary as this CI's Redpanda-round-trip gap for the backend.
        run: npm run build

  chaos-smoke-test:
    runs-on: ubuntu-latest
    needs: [backend, enrichment-service, anomaly-service, notification-service]
    # Needs the full docker-compose stack (Postgres, Redpanda, all three
    # consumer services) and deliberately kills/restarts containers —
    # worth running on main, too slow/heavy to gate every PR on.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          cp apps/core-api/.env.example apps/core-api/.env
          # A CI-only encryption key — this stack is torn down at the end of the job.
          echo "ENCRYPTION_KEY=$(python3 -c 'import secrets,base64;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')" >> apps/core-api/.env
          docker compose up -d --build postgres redis redpanda redpanda-topics core-api enrichment-service anomaly-service notification-service
          docker compose ps

      - name: Wait for core-api to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "core-api never became healthy" && exit 1

      - name: Run the consumer-crash chaos test
        run: python3 chaos/test_enrichment_recovery.py

      - name: Run the broker-outage chaos test
        run: python3 chaos/test_outbox_broker_outage.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v
