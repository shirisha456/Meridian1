name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  events-lib:
    name: Shared event contracts (libs/events)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/events
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: ruff check .

  backend:
    name: Backend tests + migration check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@localhost:5432/meridian
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # libs/events first — apps/core-api's pyproject.toml deliberately
        # doesn't declare it as a dependency (see that file's comment and
        # docs/phase7.md); this monorepo has no workspace tool, so both
        # packages are installed explicitly, in order.
        run: |
          pip install -e ../../libs/events
          pip install -e ".[dev]"
      - name: Alembic migrations apply against real Postgres
        run: alembic upgrade head
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: ruff check .

  enrichment-service:
    name: enrichment-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/enrichment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ../../libs/events
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: ruff check .

  anomaly-service:
    name: anomaly-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/anomaly-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ../../libs/events
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: ruff check .

  notification-service:
    name: notification-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ../../libs/events
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Lint
        run: ruff check .

  frontend:
    name: Frontend build, typecheck, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        # No NEXT_PUBLIC_API_URL set here — this only needs to prove the
        # app compiles and typechecks, not reach a real backend; that's
        # covered manually per-phase (see docs/phase11.md), same scope
        # boundary as this CI's Redpanda-round-trip gap for the backend.
        run: npm run build
