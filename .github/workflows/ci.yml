name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    name: Repository foundation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm skeleton checks out
        run: |
          echo "Phase 0: repository foundation only."
          echo "The backend, frontend, migration, and chaos-smoke-test jobs"
          echo "are added in the phases that introduce their code."
